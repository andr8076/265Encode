name: Integrate legacy Intel content calibration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/legacy-calibration-patch.yml'
      - 'tools/apply-legacy-calibration-integration.py'

permissions:
  contents: write

concurrency:
  group: legacy-calibration-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch 265Encode entry point
        run: python3 tools/apply-legacy-calibration-integration.py

      - name: Verify calibrator pin
        shell: bash
        run: echo '89988de003674bd6d1074dbfc7bb7960ebff274d168264e2298ee2bc967d7524  tools/legacy-intel-calibration.py' | sha256sum -c -

      - name: Run calibration policy tests
        run: python3 tools/test_legacy_intel_calibration.py

      - name: Check shell syntax and integration markers
        shell: bash
        run: |
          bash -n 265Encode.sh
          grep -Fq 'SCRIPT_VERSION="2.8"' 265Encode.sh
          grep -Fq 'configure_legacy_intel_file "$input_file"' 265Encode.sh
          grep -Fq -- '-i_qfactor -0.8421052632' 265Encode.sh
          grep -Fq -- '-bf 6 -refs 4 -g 600' 265Encode.sh
          grep -Fq -- '--no-legacy-calibration' 265Encode.sh

      - name: Commit integration directly to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 265Encode.sh
          git diff --cached --check
          git commit -m 'Add adaptive legacy Intel quality calibration'
          git push origin HEAD:main

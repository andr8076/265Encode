name: Reorganize helper tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorganize-tools.yml'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move legacy helper and update fetch path
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tools
          git mv legacy-intel.sh tools/legacy-intel.sh
          sed -i 's#https://raw.githubusercontent.com/andr8076/265Encode/main/legacy-intel.sh#https://raw.githubusercontent.com/andr8076/265Encode/main/tools/legacy-intel.sh#' 265Encode.sh

          expected=$(sed -n 's/^LEGACY_INTEL_HELPER_SHA256="\([0-9a-fA-F]*\)"/\1/p' 265Encode.sh)
          actual=$(sha256sum tools/legacy-intel.sh | awk '{print $1}')
          [[ -n "$expected" && "$actual" == "$expected" ]]

          bash -n 265Encode.sh
          bash -n tools/legacy-intel.sh
          grep -Fq 'https://raw.githubusercontent.com/andr8076/265Encode/main/tools/legacy-intel.sh' 265Encode.sh
          ! grep -Fq 'https://raw.githubusercontent.com/andr8076/265Encode/main/legacy-intel.sh' 265Encode.sh
          git diff --check

      - name: Commit cleanup to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move legacy Intel helper into tools'
          git push origin HEAD:main

      - name: Remove merged working branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin --delete compare-tool

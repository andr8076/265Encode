name: Add no-legacy Intel flag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-no-legacy-intel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('265Encode.sh')
          s=p.read_text()
          s=s.replace('DEBUG_HARDWARE="no"\nSOFTWARE_CRF="20"', 'DEBUG_HARDWARE="no"\nLEGACY_INTEL_AUTO="${ENCODE265_INTEL_LEGACY_AUTO:-1}"\nSOFTWARE_CRF="20"')
          s=s.replace('      --debug-hardware     Show hardware probe commands and full errors\n', '      --debug-hardware     Show hardware probe commands and full errors\n      --no-legacy-intel    Disable optional legacy Intel fallback for this run\n')
          s=s.replace('            --debug-hardware)\n                DEBUG_HARDWARE="yes"\n                shift\n                ;;', '            --debug-hardware)\n                DEBUG_HARDWARE="yes"\n                shift\n                ;;\n            --no-legacy-intel)\n                LEGACY_INTEL_AUTO=0\n                shift\n                ;;')
          s=s.replace('    case ${ENCODE265_INTEL_LEGACY_AUTO:-1} in 0|false|FALSE|no|NO|off|OFF) return 1 ;; esac', '    case ${LEGACY_INTEL_AUTO:-1} in 0|false|FALSE|no|NO|off|OFF) return 1 ;; esac')
          p.write_text(s)
          PY
          bash -n 265Encode.sh
          bash 265Encode.sh --help | grep -F -- '--no-legacy-intel'
          bash 265Encode.sh --version
          git diff --check
      - name: Commit to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 265Encode.sh
          git commit -m 'Add CLI switch to disable legacy Intel fallback'
          git push origin HEAD:main
      - name: Remove temporary branches
        shell: bash
        run: |
          set -Eeuo pipefail
          for b in temp-legacy-flag temp-legacy-flag-cleanup temp-ignore temp-final-clean; do
            git push origin --delete "$b" 2>/dev/null || true
          done
